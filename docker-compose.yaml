version: '3'
services:
  ros_humble:
    build: .
    image: hello_world_ros2
    container_name: hello_world_container
    deploy:
      resources:
        limits:
          cpus: '4'    # ⚠️ Уменьшите под свою систему
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - QT_QPA_PLATFORM=xcb
      - GDK_BACKEND=x11
      - ROS_DOMAIN_ID=0
      - XAUTHORITY=/tmp/.Xauthority
    ports:
      - "6000:6000/tcp"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/tmp/.Xauthority:ro
      # Исходники уже в образе, монтируем только для быстрой правки конфигов
      - ./package.xml:/ros2_ws/src/hello_world/package.xml:ro
      - ./setup.py:/ros2_ws/src/hello_world/setup.py:ro
      - ./setup.cfg:/ros2_ws/src/hello_world/setup.cfg:ro
      - ./CMakeLists.txt:/ros2_ws/src/hello_world/CMakeLists.txt:ro
    network_mode: "host"
    stdin_open: true
    tty: true
    # privileged: true  # Раскомментируйте только если X11 не работает